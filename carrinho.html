<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Sacola | Ancestrallis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260914-3">
</head>
<body>
  <div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <a href="index.html" class="text-decoration-none" style="color:#31392C">← Voltar ao catálogo</a>
      <strong style="font-family:'Libre Baskerville',serif;letter-spacing:.12em;color:#31392C">ANCESTRALLIS</strong>
    </div>
    <h1 class="text-center mb-4" style="font-family:'Libre Baskerville',serif;color:#31392C">Sua sacola</h1>
    <div class="cart-container p-3 p-md-4">
      <ul id="cart" class="list-group"></ul>
      <div class="mt-3">
        <label for="coupon-code" class="form-label">Cupom promocional</label>
        <input type="text" id="coupon-code" class="form-control" placeholder="Digite seu cupom aqui">
      </div>
      <h4 class="mt-4">Total: R$ <span id="total-price">0,00</span></h4>
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button class="btn btn-outline-danger" onclick="clearCart()">Esvaziar sacola</button>
        <button class="btn btn-success" onclick="sendOrder()">Finalizar pedido</button>
        <a href="index.html" class="btn btn-outline-secondary">Continuar escolhendo</a>
      </div>
    </div>
  </div>
  <script src="./script.js?v=20260914-3"></script>
</body>
</html>
